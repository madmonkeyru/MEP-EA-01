name: MVP quality checks
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/ingest-validate-content.mjs
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:bundle
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Run browser journeys against the production build
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          FLOW_BASE_URL=http://127.0.0.1:4173 npm run test:flows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: artifacts/
