name: MVP quality checks
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mep_test
          POSTGRES_USER: mep_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mep_test -d mep_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:postgres
        env:
          MEP_TEST_DATABASE_URL: postgresql://mep_test:ci-disposable-only@127.0.0.1:5432/mep_test
      - run: node scripts/ingest-validate-content.mjs
      - run: npm run content:check
      - run: npm run lint
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:service
      - run: npm run build:mobile
      - run: npm run audit:bundle
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Run browser journeys against the production build
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          FLOW_BASE_URL=http://127.0.0.1:4173 npm run test:foundation:browser
          FLOW_BASE_URL=http://127.0.0.1:4173 npm run test:flows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: artifacts/
