services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mep_development
      POSTGRES_USER: mep_development
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - p4_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mep_development -d mep_development']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  p4_postgres:
