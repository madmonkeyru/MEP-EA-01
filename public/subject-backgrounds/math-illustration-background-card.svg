      <stop offset="1" stop-color="#d3dde4"/>
    </linearGradient>
    <linearGradient id="gProt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6dce1"/>
      <stop offset="1" stop-color="#b9c3cb"/>
